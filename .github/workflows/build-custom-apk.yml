name: Build custom OneOS APK

on:
  push:
    branches:
      - feature/custom-image-catalog
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify full debug APK
        working-directory: app-android
        run: ./gradlew --no-daemon --stacktrace assembleFullDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oneos-custom-full-debug
          path: app-android/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
